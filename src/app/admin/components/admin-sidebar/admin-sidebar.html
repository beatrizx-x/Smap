<aside class="admin-sidebar">
  <div class="sidebar-top">
    <a class="brand" routerLink="/admin/dashboard">
  <img
    class="brand-logo"
    src="assets/Admin-img/logo.png"
    alt="Logo do SMAP"
  />

  <img
    class="brand-name"
    src="assets/Admin-img/smap.png"
    alt="SMAP"
  />
</a>

    <nav class="sidebar-navigation" aria-label="Navegação administrativa">
      <a
        class="navigation-item"
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="navigation-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </span>

        <span>Visão Geral</span>
      </a>

      <a
        class="navigation-item"
        routerLink="/admin/ocorrencias"
        routerLinkActive="active"
      >
        <span class="navigation-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <circle cx="3.5" cy="6" r="0.5" />
            <circle cx="3.5" cy="12" r="0.5" />
            <circle cx="3.5" cy="18" r="0.5" />
          </svg>
        </span>

        <span>Ocorrências</span>
      </a>

      <a
        class="navigation-item"
        routerLink="/admin/mapa"
        routerLinkActive="active"
      >
        <span class="navigation-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M9 3.5 3.8 6.1A1.5 1.5 0 0 0 3 7.4v12.1a1.5 1.5 0 0 0 2.2 1.3L9 18.5l6 3 5.2-2.6a1.5 1.5 0 0 0 .8-1.3V5.5a1.5 1.5 0 0 0-2.2-1.3L15 6.5l-6-3Z"
            />

            <path d="M15 6.5v15" />
          </svg>
        </span>

        <span>Mapa</span>
      </a>

      <a
        class="navigation-item"
        routerLink="/admin/regioes"
        routerLinkActive="active"
      >
        <span class="navigation-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18" />
            <path d="M12 3c2.2 2.4 3.3 5.4 3.3 9s-1.1 6.6-3.3 9" />
            <path d="M12 3c-2.2 2.4-3.3 5.4-3.3 9s1.1 6.6 3.3 9" />
          </svg>
        </span>

        <span>Regiões</span>
      </a>
    </nav>
  </div>

  <div class="sidebar-bottom">
    <a
      class="navigation-item settings-item"
      routerLink="/admin/configuracoes"
      routerLinkActive="active"
    >
      <span class="navigation-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12 3.5a2 2 0 0 1 2 2v.2a1.8 1.8 0 0 0 1.1 1.7 1.8 1.8 0 0 0 2-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.8 1.8 0 0 0-.3 2 1.8 1.8 0 0 0 1.7 1.1h.2a2 2 0 1 1 0 4h-.2a1.8 1.8 0 0 0-1.7 1.1 1.8 1.8 0 0 0 .3 2l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.8 1.8 0 0 0-2-.3 1.8 1.8 0 0 0-1.1 1.7v.2a2 2 0 1 1-4 0v-.2a1.8 1.8 0 0 0-1.1-1.7 1.8 1.8 0 0 0-2 .3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.8 1.8 0 0 0 .3-2A1.8 1.8 0 0 0 4.7 17h-.2a2 2 0 1 1 0-4h.2a1.8 1.8 0 0 0 1.7-1.1 1.8 1.8 0 0 0-.3-2L6 9.8A2 2 0 1 1 8.8 7l.1.1a1.8 1.8 0 0 0 2 .3A1.8 1.8 0 0 0 12 5.7v-.2a2 2 0 0 1 0-2Z"
          />

        </svg>
      </span>

      <span>Configurações</span>
    </a>

    <div class="profile">
      <div class="profile-avatar">CS</div>

      <div class="profile-information">
        <strong>Carlos Silva</strong>
        <span>Coord. Geral</span>
      </div>
    </div>
  </div>
</aside>
